name: Build installers

# Every push/PR runs the tests and builds; a tag like v0.1.0 also publishes a
# GitHub release with the Windows .exe, macOS .dmg and Linux .deb.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyserial
      - run: python -m unittest discover -s tests -v

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/linux/build_deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: linux-deb, path: dist/*.deb }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller pyserial
      - run: pyinstaller --noconfirm --onefile --windowed --name CrossTitrate --collect-submodules serial crosstitrate_app.py
      - uses: actions/upload-artifact@v4
        with: { name: windows-exe, path: dist/CrossTitrate.exe }

  macos:
    needs: test
    strategy:
      matrix:
        include:
          - { runner: macos-latest, arch: AppleSilicon }
          - { runner: macos-15-intel, arch: Intel }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller pyserial
      - run: |
          pyinstaller --noconfirm --windowed --name CrossTitrate --collect-submodules serial \
            --osx-bundle-identifier io.github.ohlincha.crosstitrate crosstitrate_app.py
          mkdir -p dmg && cp -R dist/CrossTitrate.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname CrossTitrate -srcfolder dmg -ov -format UDZO dist/CrossTitrate-macOS-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos-dmg-${{ matrix.arch }}, path: dist/CrossTitrate-macOS-${{ matrix.arch }}.dmg }

  release:
    # Publish whatever built, even if one platform failed (e.g. no macOS runner available).
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.linux.result == 'success' }}
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          # v0.x = not yet verified on real hardware
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
